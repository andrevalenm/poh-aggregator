specVersion: 1.0.0
description: >
  Normalized proof-of-personhood data on Gnosis. Indexes Proof of Humanity v2 registrations
  and vouch edges, and Circles v2 avatars and trust edges, exposing each credential with its
  issuance time and graph position so a consumer can weight by age and independence rather
  than by a boolean.
repository: https://github.com/andrevalenm/poh-aggregator
schema:
  file: ./schema.graphql

dataSources:
  # Full history: PoH has ~1,500 lifetime events, so indexing from deployment is cheap and
  # gives us the registration-rate curve that exposes the 2026 airdrop inflation.
  - kind: ethereum
    name: ProofOfHumanity
    network: gnosis
    source:
      address: "0xa4AC94C4fa65Bb352eFa30e3408e64F72aC857bc"
      abi: ProofOfHumanity
      startBlock: 35846827
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/poh.ts
      entities:
        - PohHuman
        - PohVouch
        - ProtocolDay
      abis:
        - name: ProofOfHumanity
          file: ./abis/ProofOfHumanity.json
      eventHandlers:
        - event: HumanityClaimed(bytes20,uint256)
          handler: handleHumanityClaimed
        - event: HumanityRevoked(bytes20,uint256)
          handler: handleHumanityRevoked
        - event: VouchRegistered(indexed bytes20,indexed bytes20,uint256)
          handler: handleVouchRegistered

  # Full history, from the Hub's deployment block. This was a ~2-month window (startBlock
  # 46300000) on the assumption that full history would not sync inside a hackathon; measured
  # on 2026-07-25, that assumption was wrong by ~4x. RegisterHuman + Trust across the Hub's
  # whole life is ~317,000 events (mean 582 per 20k-block window, sampled every 1M blocks from
  # deployment to head 47,388,288), and the PoH data source already forces a sync from
  # 35,846,827 anyway — so the extra blocks were already being scanned and only the events were
  # being thrown away. Windowing also cost correctness twice over: an avatar's absence proved
  # nothing (so no age bound could be derived), and the oldest, most legitimate avatars were
  # dated from whichever trust edge happened to fall inside the window.
  #
  # 36486014 is the block the Hub's code first appears at (eth_getCode is 0x at 36486013),
  # 2024-10-13T15:09:10Z. Its first RegisterHuman is 36501311.
  - kind: ethereum
    name: CirclesHub
    network: gnosis
    source:
      address: "0xc12C1E50ABB450d6205Ea2C3Fa861b3B834d13e8"
      abi: CirclesHub
      startBlock: 36486014
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/circles.ts
      entities:
        - CirclesAvatar
        - CirclesTrust
        - ProtocolDay
      abis:
        - name: CirclesHub
          file: ./abis/CirclesHub.json
      eventHandlers:
        - event: RegisterHuman(indexed address,indexed address)
          handler: handleRegisterHuman
        - event: Trust(indexed address,indexed address,uint256)
          handler: handleTrust
        - event: Stopped(indexed address)
          handler: handleStopped
